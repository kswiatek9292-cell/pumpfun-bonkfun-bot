# Paper trading mode - simulates trades without sending real transactions.
# Uses real on-chain price data to track virtual positions and P&L.
# Results are saved to the paper_trades/ directory.

# Bot identification and connection settings
name: "bot-paper-mode"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: false # Enable when you want to paper trade
separate_process: true

# Paper trading configuration
paper_mode: true
paper_initial_balance: 1.0 # Starting virtual balance in SOL

# Options: "pump_fun" (default), "lets_bonk"
platform: "pump_fun"

# Geyser configuration (fastest method for getting updates)
geyser:
  endpoint: "${GEYSER_ENDPOINT}"
  api_token: "${GEYSER_API_TOKEN}"
  auth_type: "x-token"

# Trading parameters (same as live, but no real money at risk)
trade:
  buy_amount: 0.01 # Virtual SOL per trade
  buy_slippage: 0.3
  sell_slippage: 0.3

  exit_strategy: "time_based" # Options: "time_based", "tp_sl", "manual"
  # take_profit_percentage: 0.2
  # stop_loss_percentage: 0.1
  max_hold_time: 30
  # price_check_interval: 5

  extreme_fast_mode: false # Disable for accurate paper price tracking
  extreme_fast_token_amount: 20

# Priority fees (ignored in paper mode, but required by config validation)
priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 200_000
  extra_percentage: 0.0
  hard_cap: 200_000

# Filters for token selection
filters:
  match_string: null
  bro_address: null
  listener_type: "logs" # "logs", "blocks", "geyser", or "pumpportal"
  max_token_age: 0.001
  marry_mode: false
  yolo_mode: true # Continuous trading to gather more paper data

# Retry and timeout settings
retries:
  max_attempts: 1
  wait_after_creation: 5
  wait_after_buy: 10
  wait_before_new_token: 5

# Cleanup (disabled in paper mode automatically)
cleanup:
  mode: "disabled"
  force_close_with_burn: false
  with_priority_fee: false

# Node provider configuration
node:
  max_rps: 25
